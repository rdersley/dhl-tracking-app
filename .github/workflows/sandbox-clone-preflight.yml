name: Register and Deploy Sandbox Clone

on:
  push:
    branches:
      - deploy/retailinmotion-sandbox-clone

permissions:
  contents: read

jobs:
  deploy-clone:
    runs-on: ubuntu-latest
    environment: nuvriqo-sandbox
    env:
      FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
      FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies and Forge CLI
        run: |
          npm ci
          npm install --global @forge/cli
          forge settings set usage-analytics false
      - name: Run tests
        run: npm test
      - name: Register unlicensed sandbox clone
        run: forge register "Delivery Manager Sandbox Test" --developer-space-id bb1f92fd-56a9-4352-a90a-2b705b43d6e0 --accept-terms
      - name: Show sandbox app id
        run: grep -A 5 '^app:' manifest.yml
      - name: Deploy sandbox clone to production
        run: forge deploy --environment production --non-interactive
