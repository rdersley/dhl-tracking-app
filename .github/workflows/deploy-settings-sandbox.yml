name: Deploy Delivery Manager Settings Sandbox

on:
  push:
    branches:
      - deploy/delivery-manager-settings-sandbox

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
      FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
      - name: Install Forge CLI
        run: |
          npm install --global @forge/cli
          forge settings set usage-analytics false
          forge settings set default-environment development
      - name: Deploy sandbox test app
        run: forge deploy --environment production --non-interactive --approve MAJOR_VERSION_RULE
      - name: Upgrade Nuvriqo installation to major v3
        run: forge install --site https://nuvriqo.atlassian.net --product jira --major-version 3 --environment production --non-interactive
