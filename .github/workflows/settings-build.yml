name: Delivery Manager Settings Build

on:
  push:
    branches:
      - feature/delivery-manager-settings

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
      FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/delivery-manager-settings
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh dependency lock
        run: npm install --package-lock-only
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
      - name: Forge setup
        run: |
          npm install --global @forge/cli
          forge settings set usage-analytics false
          forge settings set default-environment development
      - name: Forge lint
        run: forge lint
      - name: Persist package lock
        run: |
          if ! git diff --quiet package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Update lockfile for Delivery Manager settings UI"
            git push
          fi
