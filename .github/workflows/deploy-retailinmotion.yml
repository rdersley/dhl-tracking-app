name: Diagnose RetailInMotion Forge Environment

on:
  push:
    branches:
      - deploy/retailinmotion-hw-reconciliation

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: nuvriqo-sandbox
    env:
      FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
      FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Forge CLI
        shell: bash
        run: |
          npm install --global @forge/cli
          forge settings set usage-analytics false
      - name: List Forge environments
        shell: bash
        run: forge environments list
      - name: Check development installations
        shell: bash
        run: |
          forge settings set default-environment development
          forge install list --environment development || true
      - name: Check production installations
        shell: bash
        run: forge install list --environment production || true
