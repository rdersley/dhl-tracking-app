name: Remote Forge QA

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy and upgrade the sandbox installation
        required: true
        type: boolean
        default: false
      site:
        description: Atlassian sandbox site
        required: true
        default: nuvriqo.atlassian.net
      environment:
        description: Forge environment
        required: true
        default: development
      product:
        description: Atlassian product
        required: true
        default: jira

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
      FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
    outputs:
      forge_app: ${{ steps.detect.outputs.forge_app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: detect
        shell: bash
        run: |
          if [ -f manifest.yml ]; then echo "forge_app=true" >> "$GITHUB_OUTPUT"; else echo "forge_app=false" >> "$GITHUB_OUTPUT"; fi
      - name: Install root dependencies
        if: hashFiles('package.json') != ''
        shell: bash
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Production dependency security gate
        if: hashFiles('package.json') != ''
        shell: bash
        run: npm audit --omit=dev --audit-level=high
      - name: Run root tests when defined
        if: hashFiles('package.json') != ''
        shell: bash
        run: |
          if node -e "const p=require('./package.json');process.exit(p.scripts&&p.scripts.test?0:1)"; then npm test; else echo "No root test script; skipping"; fi
      - name: Run root build when defined
        if: hashFiles('package.json') != ''
        shell: bash
        run: |
          if node -e "const p=require('./package.json');process.exit(p.scripts&&p.scripts.build?0:1)"; then npm run build; else echo "No root build script; skipping"; fi
      - name: Build Custom UI resources
        shell: bash
        run: |
          if [ -d static ]; then
            for dir in static/*; do
              [ -d "$dir" ] || continue
              if [ -f "$dir/package.json" ]; then
                echo "Building $dir"
                if [ -f "$dir/package-lock.json" ]; then npm --prefix "$dir" ci; else npm --prefix "$dir" install; fi
                if node -e "const p=require('./$dir/package.json');process.exit(p.scripts&&p.scripts.build?0:1)"; then npm --prefix "$dir" run build; else echo "No build script in $dir; skipping"; fi
              fi
            done
          fi
      - name: Forge lint
        if: steps.detect.outputs.forge_app == 'true'
        shell: bash
        run: |
          if [ -z "$FORGE_EMAIL" ] || [ -z "$FORGE_API_TOKEN" ]; then echo "Forge secrets are not configured for this repository; skipping Forge lint."; exit 0; fi
          npm install --global @forge/cli
          forge settings set usage-analytics false
          forge settings set default-environment development
          set +e
          forge lint 2>&1 | tee /tmp/forge-lint.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ] && grep -Eq '\(0 errors,' /tmp/forge-lint.log; then
            echo "Forge lint reported warnings/approval notices but no errors; continuing."
            exit 0
          fi
          exit "$status"

  deploy-sandbox:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == true && needs.validate.outputs.forge_app == 'true'
    runs-on: ubuntu-latest
    environment: nuvriqo-sandbox
    env:
      FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
      FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Forge credentials
        shell: bash
        run: |
          test -n "$FORGE_EMAIL" || (echo "Missing FORGE_EMAIL secret" && exit 1)
          test -n "$FORGE_API_TOKEN" || (echo "Missing FORGE_API_TOKEN secret" && exit 1)
      - name: Install root dependencies and Forge CLI
        shell: bash
        run: |
          if [ -f package-lock.json ]; then npm ci; elif [ -f package.json ]; then npm install; fi
          npm install --global @forge/cli
          forge settings set usage-analytics false
          forge settings set default-environment "${{ inputs.environment }}"
      - name: Build Custom UI resources
        shell: bash
        run: |
          if [ -d static ]; then
            for dir in static/*; do
              [ -d "$dir" ] || continue
              if [ -f "$dir/package.json" ]; then
                if [ -f "$dir/package-lock.json" ]; then npm --prefix "$dir" ci; else npm --prefix "$dir" install; fi
                if node -e "const p=require('./$dir/package.json');process.exit(p.scripts&&p.scripts.build?0:1)"; then npm --prefix "$dir" run build; fi
              fi
            done
          fi
      - name: Deploy Forge app
        run: forge deploy --environment "${{ inputs.environment }}" --non-interactive
      - name: Upgrade sandbox installation
        run: forge install --upgrade --site "${{ inputs.site }}" --product "${{ inputs.product }}" --environment "${{ inputs.environment }}" --confirm-scopes --non-interactive
      - name: Verify TEST project is reachable
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        shell: bash
        run: |
          if [ -z "$JIRA_EMAIL" ] || [ -z "$JIRA_API_TOKEN" ]; then echo "JIRA_EMAIL/JIRA_API_TOKEN not configured; skipping REST smoke check"; exit 0; fi
          code=$(curl -sS -o /tmp/project.json -w "%{http_code}" -u "$JIRA_EMAIL:$JIRA_API_TOKEN" "https://${{ inputs.site }}/rest/api/3/project/TEST")
          test "$code" = "200" || (cat /tmp/project.json && exit 1)
          echo "Sandbox TEST project reachable"
