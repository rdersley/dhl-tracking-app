modules:
  scheduledTrigger:
    - key: delivery-manager-scheduler
      function: delivery-manager
      interval: fiveMinute

  function:
    - key: delivery-manager
      handler: scheduler.runCombinedScheduler
      timeoutSeconds: 180

permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:servicedesk-request
    - write:servicedesk-request
  external:
    fetch:
      backend:
        - address: 'https://api-eu.dhl.com'

app:
  id: ari:cloud:ecosystem::app/86d70337-4eb0-48bc-945b-afc5f32ca0da
  runtime:
    name: nodejs22.x
    memoryMB: 256
    architecture: arm64
