modules:
  scheduledTrigger:
    - key: dhl-tracking-scheduler
      function: dhl-scheduler
      interval: fiveMinute

  jira:adminPage:
    - key: dhl-tracking-admin
      resource: admin-page
      render: native
      resolver:
        function: admin-resolver
      title: DHL Tracking

    - key: dhl-tracking-configure
      resource: admin-page
      render: native
      resolver:
        function: admin-resolver
      title: DHL Tracking
      useAsConfig: true

    - key: dhl-shipment-admin
      resource: shipment-admin-page
      render: native
      resolver:
        function: shipment-resolver
      title: DHL Shipment Creation

  jira:issueContext:
    - key: dhl-create-shipment-context
      resource: shipment-panel
      render: native
      resolver:
        function: shipment-resolver
      title: DHL Shipment
      label: Create DHL Shipment

  function:
    - key: dhl-scheduler
      handler: index.run
      timeoutSeconds: 180

    - key: admin-resolver
      handler: resolver.handler

    - key: shipment-resolver
      handler: shipping-resolver.handler

resources:
  - key: admin-page
    path: src/frontend/admin-page.jsx
  - key: shipment-admin-page
    path: src/frontend/shipping-admin.jsx
  - key: shipment-panel
    path: src/frontend/shipping-panel.jsx

permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:servicedesk-request
    - write:servicedesk-request
    - storage:app
  external:
    fetch:
      backend:
        - address: "https://api-eu.dhl.com"
          inScopeEUD: false
        - address: "https://express.api.dhl.com"
          inScopeEUD: false

app:
  id: ari:cloud:ecosystem::app/86d70337-4eb0-48bc-945b-afc5f32ca0da
  licensing:
    enabled: true
  runtime:
    name: nodejs22.x
    memoryMB: 256
    architecture: arm64
