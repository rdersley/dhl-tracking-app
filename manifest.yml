modules:
  scheduledTrigger:
    - key: dhl-tracking-scheduler
      function: main
      interval: hour
    - key: hardware-handover-scheduler
      function: hardware-sync
      interval: fiveMinute

  function:
    - key: main
      handler: index.run
    - key: hardware-sync
      handler: hardware-sync.runHardwareSync

permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:servicedesk-request
    - write:servicedesk-request
  external:
    fetch:
      backend:
        - address: 'https://api-eu.dhl.com'

app:
  id: ari:cloud:ecosystem::app/86d70337-4eb0-48bc-945b-afc5f32ca0da
  runtime:
    name: nodejs22.x
    memoryMB: 256
    architecture: arm64
