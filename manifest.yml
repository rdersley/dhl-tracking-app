modules:
  jira:adminPage:
    - key: dm-settings
      resource: dm-settings-ui
      render: native
      resolver:
        function: dm-settings-resolver
      title: Delivery Manager
      useAsConfig: true

  scheduledTrigger:
    - key: delivery-manager-scheduler
      function: delivery-manager
      interval: fiveMinute

  function:
    - key: delivery-manager
      handler: scheduler.runCombinedScheduler
      timeoutSeconds: 180
    - key: dm-settings-resolver
      handler: settings-resolver.handler

resources:
  - key: dm-settings-ui
    path: src/frontend/settings.jsx

permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:servicedesk-request
    - write:servicedesk-request
  external:
    fetch:
      backend:
        - address: 'https://api-eu.dhl.com'

app:
  id: ari:cloud:ecosystem::app/f0ecb50d-1984-4439-a763-aac7fee40051
  runtime:
    name: nodejs22.x
    memoryMB: 256
    architecture: arm64
