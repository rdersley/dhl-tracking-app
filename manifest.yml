modules:
  scheduledTrigger:
    - key: dhl-tracking-scheduler
      function: dhl-scheduler
      interval: fiveMinute
      filter:
        appIsLicensed: true

  jira:adminPage:
    - key: dhl-tracking-admin
      resource: admin-page
      render: native
      resolver:
        function: admin-resolver
      title: DHL Tracking

    - key: dhl-tracking-configure
      resource: admin-page
      render: native
      resolver:
        function: admin-resolver
      title: DHL Tracking
      useAsConfig: true

  function:
    - key: dhl-scheduler
      handler: index.run
      timeoutSeconds: 900

    - key: admin-resolver
      handler: resolver.handler

resources:
  - key: admin-page
    path: src/frontend/admin-page.jsx

permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - write:servicedesk-request
    - storage:app
  external:
    fetch:
      backend:
        - address: "https://api-eu.dhl.com"
          inScopeEUD: false

app:
  id: ari:cloud:ecosystem::app/86d70337-4eb0-48bc-945b-afc5f32ca0da
  licensing:
    enabled: true
  runtime:
    name: nodejs22.x
    memoryMB: 256
    architecture: arm64
